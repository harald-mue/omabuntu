# Omabuntu Hyprlock surface (MIT, this project).
#
# Deliberately static: no cmd[...] execution, no onclick commands, no script,
# source, user-config inclusion, or reload command. Upstream's packaged sample
# is not used because it runs `date` and `hyprctl`. The path is a tilde path
# that Hyprlock 0.9.6 expands itself. Omabuntu updates that symlink when the
# wallpaper changes; this file does not read the background record and does not
# take a screenshot. Three blur passes use Hyprlock's own blur defaults. If the
# still is missing, the flat color remains. Password buffer clearing uses
# Esc/Ctrl+U. Authentication stays on the package-managed PAM service
# `hyprlock` (default).

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/omabuntu/current/lock-background
    color = rgb(16, 19, 21)
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    rounding = 8
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(202, 204, 204)
    check_color = rgb(202, 204, 204)
    fail_color = rgb(238, 136, 136)
    font_color = rgb(202, 204, 204)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
