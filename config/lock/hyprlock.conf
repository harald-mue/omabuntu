# Omabuntu minimal Hyprlock surface (MIT, this project).
#
# Deliberately static: no cmd[...] execution, no onclick commands, no script,
# source or user-config inclusion. Upstream's packaged sample is not used
# because it runs `date` and `hyprctl`. Password buffer clearing uses Esc/Ctrl+U.
# Authentication stays on the package-managed PAM service `hyprlock` (default).

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(16, 19, 21)
}

input-field {
    monitor =
    size = 20%, 5%
    rounding = 8
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(202, 204, 204)
    check_color = rgb(202, 204, 204)
    fail_color = rgb(238, 136, 136)
    font_color = rgb(202, 204, 204)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgb(202, 204, 204)
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = Omabuntu
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgb(143, 143, 143)
    position = 0, -140
    halign = center
    valign = center
}
