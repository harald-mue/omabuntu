# SPDX-License-Identifier: MIT
# Managed by the Omabuntu installer (plan 068); a later install overwrites this
# file. It is an additive systemd user drop-in for Ubuntu's package-owned
# hyprpaper.service and is deployed to
# ~/.config/systemd/user/hyprpaper.service.d/omabuntu.conf.
#
# hyprpaper is a Hyprland tool. Ubuntu's unit only checks WAYLAND_DISPLAY, so it
# also starts in GNOME, where no compositor socket exists: hyprpaper falls back
# to standalone KMS/DRM output, cannot get the DRM master GNOME holds and
# crashes (GBM/SIGSEGV). systemd ANDs conditions of the same type across the
# unit and its drop-ins, so adding HYPRLAND_INSTANCE_SIGNATURE keeps the
# existing WAYLAND_DISPLAY check and starts hyprpaper only in a Hyprland
# session. Hyprland imports that variable into the user manager itself.
[Unit]
ConditionEnvironment=HYPRLAND_INSTANCE_SIGNATURE
